# ============================================================
# Desafio+ — Cloudflare Workers Configuration
# ============================================================
# Backend: Hono (framework nativo Workers) com adapter Express→Hono
# Local dev: node server.js (Express puro)
# Deploy: wrangler deploy
# ============================================================

name = "desafio-plus-api"

# ── Entry point Hono (Workers) ────────────────────────────
main = "backend/worker.js"

compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]


# ── D1 Database ─────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "desafio-plus-db"
database_id = "e9687572-c64c-4db0-a5c1-babc4102a672"

# ── R2 Storage ──────────────────────────────────────────────
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "desafio-plus-media"
preview_bucket_name = "desafio-plus-media"

# ── KV (cache / sessões) ────────────────────────────────────
[[kv_namespaces]]
binding = "CACHE"
id = "48db5536a2e64c84880e300cf4041b56"
preview_id = "e8fe77c9c9b24a10b3a17476bf97b159"

# ── Variáveis de ambiente (produção) ────────────────────────
[vars]
NODE_ENV = "production"
APP_NAME = "Desafio+"
FRONTEND_URL = "https://desafio-plus.pages.dev"

# ── Secrets (configure via: wrangler secret put NOME_DO_SECRET)
# JWT_SECRET (já configurado)
# OPENAI_API_KEY (já configurado)

# ── Ambientes ───────────────────────────────────────────────
[env.staging]
name = "desafio-plus-api-staging"
vars = { NODE_ENV = "staging", FRONTEND_URL = "https://staging.desafio-plus.pages.dev" }

[env.development]
name = "desafio-plus-api-dev"
vars = { NODE_ENV = "development", FRONTEND_URL = "http://localhost:3000" }